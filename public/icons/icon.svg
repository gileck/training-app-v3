<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0EA5E9"/>
      <stop offset="50%" style="stop-color:#3B82F6"/>
      <stop offset="100%" style="stop-color:#1E3A8A"/>
    </linearGradient>
    <linearGradient id="iconGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#ffffff"/>
      <stop offset="100%" style="stop-color:#e0e7ff"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#000" flood-opacity="0.2"/>
    </filter>
    <filter id="innerGlow">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>
  
  <!-- Background with rounded corners for iOS -->
  <rect width="512" height="512" rx="108" ry="108" fill="url(#bgGradient)"/>
  
  <!-- Subtle inner border -->
  <rect x="12" y="12" width="488" height="488" rx="96" ry="96" fill="none" stroke="rgba(255,255,255,0.15)" stroke-width="2"/>
  
  <!-- Decorative circles -->
  <circle cx="256" cy="256" r="160" fill="none" stroke="rgba(255,255,255,0.06)" stroke-width="50"/>
  
  <!-- Kettlebell icon -->
  <g filter="url(#shadow)" transform="translate(256, 270)">
    <!-- Handle -->
    <path d="M-45,-95 
             C-45,-130 -30,-145 0,-145 
             C30,-145 45,-130 45,-95
             L45,-75
             C45,-60 30,-50 0,-50
             C-30,-50 -45,-60 -45,-75
             Z" 
          fill="none" 
          stroke="url(#iconGradient)" 
          stroke-width="22"
          stroke-linecap="round"/>
    
    <!-- Body (bell) -->
    <ellipse cx="0" cy="45" rx="75" ry="85" fill="url(#iconGradient)"/>
    
    <!-- Handle connection plate -->
    <ellipse cx="0" cy="-45" rx="45" ry="20" fill="url(#iconGradient)"/>
    
    <!-- Highlight on body -->
    <ellipse cx="-25" cy="20" rx="18" ry="35" fill="rgba(255,255,255,0.3)" transform="rotate(-15)"/>
    
    <!-- Weight marking -->
    <text x="0" y="70" text-anchor="middle" font-family="Arial, sans-serif" font-weight="bold" font-size="36" fill="rgba(59,130,246,0.6)">KG</text>
  </g>
  
  <!-- Sparkle accents -->
  <circle cx="100" cy="100" r="6" fill="rgba(255,255,255,0.5)"/>
  <circle cx="420" cy="120" r="4" fill="rgba(255,255,255,0.4)"/>
  <circle cx="400" cy="400" r="5" fill="rgba(255,255,255,0.3)"/>
  <circle cx="110" cy="380" r="3" fill="rgba(255,255,255,0.35)"/>
</svg>
