<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#667EEA"/>
      <stop offset="50%" style="stop-color:#764BA2"/>
      <stop offset="100%" style="stop-color:#F97316"/>
    </linearGradient>
    <linearGradient id="iconGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ffffff"/>
      <stop offset="100%" style="stop-color:#f0f0f0"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#000" flood-opacity="0.15"/>
    </filter>
  </defs>
  
  <!-- Background with rounded corners for iOS -->
  <rect width="512" height="512" rx="108" ry="108" fill="url(#bgGradient)"/>
  
  <!-- Subtle inner glow -->
  <rect x="16" y="16" width="480" height="480" rx="92" ry="92" fill="none" stroke="rgba(255,255,255,0.1)" stroke-width="2"/>
  
  <!-- Dumbbell icon - modern fitness symbol -->
  <g filter="url(#shadow)" transform="translate(256, 256)">
    <!-- Center bar -->
    <rect x="-100" y="-12" width="200" height="24" rx="12" fill="url(#iconGradient)"/>
    
    <!-- Left weight plates -->
    <rect x="-140" y="-50" width="32" height="100" rx="8" fill="url(#iconGradient)"/>
    <rect x="-160" y="-70" width="24" height="140" rx="6" fill="url(#iconGradient)"/>
    
    <!-- Right weight plates -->
    <rect x="108" y="-50" width="32" height="100" rx="8" fill="url(#iconGradient)"/>
    <rect x="136" y="-70" width="24" height="140" rx="6" fill="url(#iconGradient)"/>
  </g>
  
  <!-- Decorative accent ring -->
  <circle cx="256" cy="256" r="180" fill="none" stroke="rgba(255,255,255,0.08)" stroke-width="40"/>
  
  <!-- Small sparkle accents -->
  <circle cx="120" cy="120" r="8" fill="rgba(255,255,255,0.4)"/>
  <circle cx="400" cy="140" r="5" fill="rgba(255,255,255,0.3)"/>
  <circle cx="380" cy="380" r="6" fill="rgba(255,255,255,0.25)"/>
</svg>

