<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0EA5E9"/>
      <stop offset="50%" style="stop-color:#3B82F6"/>
      <stop offset="100%" style="stop-color:#1E3A8A"/>
    </linearGradient>
    <linearGradient id="figure1Gradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#ffffff"/>
      <stop offset="100%" style="stop-color:#cbd5e1"/>
    </linearGradient>
    <linearGradient id="figure2Gradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#fde68a"/>
      <stop offset="100%" style="stop-color:#f59e0b"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000" flood-opacity="0.15"/>
    </filter>
  </defs>
  
  <!-- Background with rounded corners for iOS -->
  <rect width="512" height="512" rx="108" ry="108" fill="url(#bgGradient)"/>
  
  <!-- Subtle inner border -->
  <rect x="12" y="12" width="488" height="488" rx="96" ry="96" fill="none" stroke="rgba(255,255,255,0.12)" stroke-width="2"/>
  
  <!-- Decorative arc -->
  <circle cx="256" cy="256" r="155" fill="none" stroke="rgba(255,255,255,0.08)" stroke-width="45"/>
  
  <!-- Figure 1 (Left) - Dumbbell curl pose -->
  <g filter="url(#shadow)" transform="translate(155, 265)">
    <!-- Head -->
    <circle cx="0" cy="-90" r="28" fill="url(#figure1Gradient)"/>
    
    <!-- Body/Torso - standing straight -->
    <path d="M0,-60 L0,40" stroke="url(#figure1Gradient)" stroke-width="18" stroke-linecap="round" fill="none"/>
    
    <!-- Left arm down holding dumbbell -->
    <path d="M0,-50 Q-25,-40 -35,-10" stroke="url(#figure1Gradient)" stroke-width="14" stroke-linecap="round" fill="none"/>
    <!-- Left dumbbell -->
    <rect x="-52" y="-18" width="34" height="12" rx="4" fill="url(#figure1Gradient)"/>
    <rect x="-56" y="-22" width="8" height="20" rx="2" fill="url(#figure1Gradient)"/>
    <rect x="-22" y="-22" width="8" height="20" rx="2" fill="url(#figure1Gradient)"/>
    
    <!-- Right arm curling up -->
    <path d="M0,-50 Q30,-55 40,-85" stroke="url(#figure1Gradient)" stroke-width="14" stroke-linecap="round" fill="none"/>
    <!-- Right dumbbell (curled up) -->
    <rect x="28" y="-105" width="34" height="12" rx="4" fill="url(#figure1Gradient)"/>
    <rect x="24" y="-109" width="8" height="20" rx="2" fill="url(#figure1Gradient)"/>
    <rect x="58" y="-109" width="8" height="20" rx="2" fill="url(#figure1Gradient)"/>
    
    <!-- Legs - wide stance -->
    <path d="M0,40 Q-15,75 -25,105" stroke="url(#figure1Gradient)" stroke-width="16" stroke-linecap="round" fill="none"/>
    <path d="M0,40 Q15,75 25,105" stroke="url(#figure1Gradient)" stroke-width="16" stroke-linecap="round" fill="none"/>
  </g>
  
  <!-- Figure 2 (Right) - Overhead press pose -->
  <g filter="url(#shadow)" transform="translate(355, 265)">
    <!-- Head -->
    <circle cx="0" cy="-85" r="26" fill="url(#figure2Gradient)"/>
    
    <!-- Body/Torso -->
    <path d="M0,-57 L0,40" stroke="url(#figure2Gradient)" stroke-width="16" stroke-linecap="round" fill="none"/>
    
    <!-- Both arms up holding barbell overhead -->
    <path d="M0,-48 Q-25,-70 -30,-95" stroke="url(#figure2Gradient)" stroke-width="12" stroke-linecap="round" fill="none"/>
    <path d="M0,-48 Q25,-70 30,-95" stroke="url(#figure2Gradient)" stroke-width="12" stroke-linecap="round" fill="none"/>
    
    <!-- Barbell overhead -->
    <rect x="-55" y="-108" width="110" height="10" rx="5" fill="url(#figure2Gradient)"/>
    <!-- Weight plates -->
    <rect x="-65" y="-115" width="14" height="24" rx="3" fill="url(#figure2Gradient)"/>
    <rect x="51" y="-115" width="14" height="24" rx="3" fill="url(#figure2Gradient)"/>
    
    <!-- Legs - stable stance -->
    <path d="M0,40 Q-12,72 -20,100" stroke="url(#figure2Gradient)" stroke-width="14" stroke-linecap="round" fill="none"/>
    <path d="M0,40 Q12,72 20,100" stroke="url(#figure2Gradient)" stroke-width="14" stroke-linecap="round" fill="none"/>
  </g>
  
  <!-- Sparkle accents -->
  <circle cx="95" cy="100" r="5" fill="rgba(255,255,255,0.5)"/>
  <circle cx="420" cy="105" r="4" fill="rgba(255,255,255,0.45)"/>
  <circle cx="415" cy="405" r="4" fill="rgba(255,255,255,0.3)"/>
  <circle cx="100" cy="400" r="3" fill="rgba(255,255,255,0.35)"/>
</svg>
